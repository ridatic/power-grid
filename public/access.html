<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Accès | Power-Grid</title>
    <meta name="description" content="Accès réservé." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/status/status.css" />
    <script src="/status/access.js" defer></script>
  </head>
  <body>
    <main>
      <div class="panel">
        <div class="word sm" role="img" aria-label="Power-Grid">
          <svg viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0.6"><stop offset="0" stop-color="#f97316"/><stop offset="1" stop-color="#dc2626"/></linearGradient></defs><path fill="url(#g)" d="M13.4 1.6 3.9 13.4c-.4.5 0 1.2.6 1.2h6.1l-1.3 7.4c-.1.7.8 1.1 1.2.5l9.6-12c.4-.5 0-1.2-.6-1.2h-6.1l1.2-7.2c.1-.7-.8-1.1-1.2-.5z"/></svg>
          <span>Power-Grid</span>
        </div>
        <h1>Accès réservé.</h1>
        <p class="sub">Saisissez le code pour utiliser Power-Grid pendant la maintenance.</p>
        <form method="post" action="/access">
          <label for="code">Code</label>
          <div class="row">
            <input id="code" name="code" type="password" autocomplete="current-password" required autofocus />
            <button type="submit">Entrer</button>
          </div>
          <p class="err" id="err" role="alert" hidden>Code incorrect. Réessayez.</p>
        </form>
      </div>
    </main>
  </body>
</html>
